global:
  scrape_interval: 5s # Ogni quanti secondi Prometheus legge i dati (basso per l'esame, così l'allarme scatta subito!)

scrape_configs:
  - job_name: 'spring-boot-actuator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['spring-backend:8080'] # Usa il nome del servizio del backend definito nel compose